name: Build & Publish Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build Android APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Prepare Release APK
        run: |
          TAG="${GITHUB_REF_NAME:-v0.1.0}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "shaonianpai-${TAG}.apk"
          sha256sum "shaonianpai-${TAG}.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="shaonianpai-${TAG}.apk"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          gh release create "$TAG" "$APK" \
            --title "${TAG} · 少年派学习平板复刻版" \
            --notes "自动构建发布 ${TAG}。支持平板横屏与手机竖屏，内置 GitHub Releases 自动检查更新与安装。

          - APK: \`${APK}\`
          - SHA-256: \`${SHA}\`" || gh release upload "$TAG" "$APK" --clobber
